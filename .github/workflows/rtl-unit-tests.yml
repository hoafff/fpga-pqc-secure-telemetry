name: RTL unit tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify generated ML-KEM twiddles
        run: python3 software/reference/generate_twiddles_3329.py --check

      - name: Verify forward NTT schedule
        run: python3 software/reference/generate_forward_ntt_schedule.py --check

      - name: Verify forward NTT integration models
        run: python3 software/reference/generate_forward_ntt_vectors.py --check

      - name: Verify Kiwi Primer 20K board self-test vector
        run: python3 software/reference/generate_kiwi_primer20k_selftest.py --check

      - name: Verify Ascon-AEAD128 reference vectors
        run: python3 software/reference/check_ascon_aead128.py

      - name: Run exhaustive Python arithmetic check
        run: python3 software/reference/check_barrett_3329.py

      - name: Run SN32F407 portable firmware tests
        id: sn32_portable
        continue-on-error: true
        run: |
          mkdir -p build/sn32-portable
          cmake -S targets/sn32f407/firmware \
                -B build/sn32f407-firmware-host \
                > build/sn32-portable/configure.log 2>&1
          cmake --build build/sn32f407-firmware-host \
                > build/sn32-portable/build.log 2>&1
          ctest --test-dir build/sn32f407-firmware-host --output-on-failure \
                > build/sn32-portable/test.log 2>&1

      - name: Fetch pinned mlkem-native v1.0.0
        run: |
          git clone --depth 1 --branch v1.0.0 \
            https://github.com/pq-code-package/mlkem-native.git \
            build/third_party/mlkem-native
          test "$(git -C build/third_party/mlkem-native rev-parse HEAD)" = \
            "048fc2a7a7b4ba0ad4c989c1ac82491aa94d5bfa"

      - name: Run SN32F407 ML-KEM differential and SRAM preflight tests
        id: sn32_mlkem
        continue-on-error: true
        run: |
          mkdir -p build/mlkem
          cmake -S targets/sn32f407/firmware \
                -B build/sn32f407-firmware-mlkem \
                -DFPST_ENABLE_MLKEM_NATIVE=ON \
                -DFPST_MLKEM_NATIVE_ROOT="$GITHUB_WORKSPACE/build/third_party/mlkem-native" \
                > build/mlkem/configure.log 2>&1
          cmake --build build/sn32f407-firmware-mlkem \
                > build/mlkem/build.log 2>&1
          ctest --test-dir build/sn32f407-firmware-mlkem \
                -R 'mlkem_(native_wrapper|memory_preflight)' --output-on-failure \
                > build/mlkem/test.log 2>&1

      - name: Install open-source HDL tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq iverilog yosys

      - name: Run SystemVerilog unit and integration tests
        id: rtl_tests
        continue-on-error: true
        run: |
          mkdir -p build/sim
          bash scripts/sim/run_iverilog_unit_tests.sh \
            > build/sim/rtl-unit-tests.log 2>&1

      - name: Run Primer 1 complete PQC SPI regression
        id: primer1_pqc_wire
        continue-on-error: true
        run: |
          mkdir -p build/sim
          bash scripts/sim/run_primer1_pqc_wire_test.sh \
            > build/sim/primer1-pqc-wire.log 2>&1

      - name: Run Primer 2 secure RX deployment regression
        id: primer2_rx_tests
        continue-on-error: true
        run: |
          mkdir -p build/sim
          bash scripts/sim/run_primer2_deployment_tests.sh \
            > build/sim/primer2-deployment.log 2>&1

      - name: Run Yosys memory and core synthesis checks
        id: core_synth_check
        continue-on-error: true
        run: bash scripts/synth/check_forward_ntt_core_yosys.sh

      - name: Run NTT board-top synthesis check
        id: ntt_board_synth_check
        continue-on-error: true
        run: bash scripts/synth/check_kiwi_primer20k_selftest_yosys.sh

      - name: Run Ascon board-top synthesis check
        id: ascon_board_synth_check
        continue-on-error: true
        run: bash scripts/synth/check_kiwi_primer20k_ascon_selftest_yosys.sh

      - name: Run Primer 1 deployment-top synthesis check
        id: primer1_deploy_synth_check
        continue-on-error: true
        run: bash scripts/synth/check_kiwi_primer20k_fpst_deployment_yosys.sh

      - name: Run Primer 2 deployment-top synthesis check
        id: primer2_deploy_synth_check
        continue-on-error: true
        run: bash scripts/synth/check_kiwi_primer20k_fpst_rx_deployment_yosys.sh

      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-logs
          path: |
            build/sn32-portable/configure.log
            build/sn32-portable/build.log
            build/sn32-portable/test.log
            build/mlkem/configure.log
            build/mlkem/build.log
            build/mlkem/test.log
            build/sim/rtl-unit-tests.log
            build/sim/primer1-pqc-wire.log
            build/sim/primer2-deployment.log
            build/synth/yosys-forward-ntt-memory.log
            build/synth/yosys-forward-ntt-core.log
            build/synth/yosys-kiwi-primer20k-selftest.log
            build/synth/yosys-kiwi-primer20k-ascon-selftest.log
            build/synth/yosys-kiwi-primer20k-fpst-deployment.log
            build/synth/yosys-kiwi-primer20k-fpst-rx-deployment.log
          if-no-files-found: warn

      - name: Report verification failure
        if: steps.sn32_portable.outcome == 'failure' || steps.sn32_mlkem.outcome == 'failure' || steps.rtl_tests.outcome == 'failure' || steps.primer1_pqc_wire.outcome == 'failure' || steps.primer2_rx_tests.outcome == 'failure' || steps.core_synth_check.outcome == 'failure' || steps.ntt_board_synth_check.outcome == 'failure' || steps.ascon_board_synth_check.outcome == 'failure' || steps.primer1_deploy_synth_check.outcome == 'failure' || steps.primer2_deploy_synth_check.outcome == 'failure'
        run: |
          if [ -f build/sn32-portable/configure.log ]; then
            cat build/sn32-portable/configure.log
          fi
          if [ -f build/sn32-portable/build.log ]; then
            cat build/sn32-portable/build.log
          fi
          if [ -f build/sn32-portable/test.log ]; then
            cat build/sn32-portable/test.log
          fi
          if [ -f build/mlkem/configure.log ]; then
            cat build/mlkem/configure.log
          fi
          if [ -f build/mlkem/build.log ]; then
            cat build/mlkem/build.log
          fi
          if [ -f build/mlkem/test.log ]; then
            cat build/mlkem/test.log
          fi
          if [ -f build/sim/rtl-unit-tests.log ]; then
            cat build/sim/rtl-unit-tests.log
          fi
          if [ -f build/sim/primer1-pqc-wire.log ]; then
            cat build/sim/primer1-pqc-wire.log
          fi
          if [ -f build/sim/primer2-deployment.log ]; then
            cat build/sim/primer2-deployment.log
          fi
          if [ -f build/synth/yosys-forward-ntt-memory.log ]; then
            cat build/synth/yosys-forward-ntt-memory.log
          fi
          if [ -f build/synth/yosys-forward-ntt-core.log ]; then
            cat build/synth/yosys-forward-ntt-core.log
          fi
          if [ -f build/synth/yosys-kiwi-primer20k-selftest.log ]; then
            cat build/synth/yosys-kiwi-primer20k-selftest.log
          fi
          if [ -f build/synth/yosys-kiwi-primer20k-ascon-selftest.log ]; then
            cat build/synth/yosys-kiwi-primer20k-ascon-selftest.log
          fi
          if [ -f build/synth/yosys-kiwi-primer20k-fpst-deployment.log ]; then
            cat build/synth/yosys-kiwi-primer20k-fpst-deployment.log
          fi
          if [ -f build/synth/yosys-kiwi-primer20k-fpst-rx-deployment.log ]; then
            cat build/synth/yosys-kiwi-primer20k-fpst-rx-deployment.log
          fi
          exit 1
