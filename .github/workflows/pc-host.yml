name: pc-host

on:
  push:
    paths:
      - 'software/host/**'
      - 'targets/pc/**'
      - '.github/workflows/pc-host.yml'
  pull_request:
    paths:
      - 'software/host/**'
      - 'targets/pc/**'
      - '.github/workflows/pc-host.yml'

jobs:
  unit-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    defaults:
      run:
        working-directory: software/host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install host package
        run: python -m pip install -e .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test
        run: fpst-host --help
